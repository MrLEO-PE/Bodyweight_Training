<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15202B">
<title>Bodyweight Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#EEF2F5; --card:#FFFFFF; --ink:#15202B; --muted:#5B6875; --line:#D3DAE1;
  --l1:#4FB283; --l2:#2B8FC6; --l3:#EE9B2D; --l4:#DD4B26;
  --on1:#0E2A1D; --on2:#FFFFFF; --on3:#2B1A04; --on4:#FFFFFF;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#10161D;--card:#19222C;--ink:#E7EDF3;--muted:#97A5B3;--line:#2A3542}
}
:root[data-theme="dark"]{--paper:#10161D;--card:#19222C;--ink:#E7EDF3;--muted:#97A5B3;--line:#2A3542}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 17px/1.45 var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
.demo{background:var(--l3);color:var(--on3);text-align:center;font-size:.9rem;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.offline{background:var(--ink);color:var(--paper);text-align:center;font-size:.9rem;padding:6px 12px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:760px;margin:0 auto;padding:14px 16px}
.brand{font-family:var(--display);font-weight:800;font-size:1.55rem;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.ladder{display:inline-flex;align-items:flex-end;gap:3px;height:22px}
.ladder i{width:6px;border-radius:2px}
#who{display:flex;align-items:center;gap:10px;font-weight:600}
.wrap{max-width:760px;margin:0 auto;padding:4px 16px 140px}
h1{font-family:var(--display);font-weight:800;font-size:2.5rem;line-height:1;margin:.3em 0 .35em}
h2{font-family:var(--display);font-weight:700;font-size:1.55rem;margin:1.5em 0 .4em}
.h3{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0 0 10px}
p{max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{font:600 1rem var(--body);border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:.7em 1.2em;border-radius:999px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:.4em .9em;font-size:.9rem}
.btn.danger{background:transparent;border-color:var(--l4);color:var(--l4)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}
:focus-visible{outline:3px solid var(--l2);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-weight:600;margin-bottom:6px}
.check{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-weight:500}
.check input{width:auto}
input,select,textarea{font:500 1rem var(--body);width:100%;padding:.65em .8em;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
@media (max-width:520px){.row2,.row3{grid-template-columns:1fr}}
details.panel summary{cursor:pointer;font-weight:700}
details.panel[open] summary{margin-bottom:12px}

/* home */
.stairs{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;gap:6px;margin:22px 0 28px}
.stairs div{background:var(--lc);color:var(--lon);border-radius:10px 10px 4px 4px;padding:10px;font-weight:600;font-size:.92rem;line-height:1.2;display:flex;flex-direction:column;justify-content:flex-end}
.stairs div:nth-child(1){height:78px}.stairs div:nth-child(2){height:112px}.stairs div:nth-child(3){height:146px}.stairs div:nth-child(4){height:180px}
.stairs .st{font-family:var(--display);font-weight:800;font-size:1.3rem}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.choice{grid-template-columns:1fr}}
.role{text-align:left;padding:20px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.role:hover{border-color:var(--ink)}
.role b{display:block;font-family:var(--display);font-size:1.6rem}

/* progress */
.goal .big{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1}
.goalbar{display:flex;gap:5px;margin-top:12px}
.goalbar i{flex:1;height:12px;border-radius:6px;background:var(--line)}
.goalbar i.on{background:var(--l1)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.tile:last-child{grid-column:span 2}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05}
.tile span{color:var(--muted);font-size:.9rem}
.chart{position:relative;max-width:560px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 13px var(--body)}
.chart .ln{fill:none;stroke:var(--l2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--l2);stroke:var(--card);stroke-width:2}
.chart .hl{fill:var(--l2);stroke:var(--ink);stroke-width:2}
.tip{position:absolute;transform:translate(-50%,calc(-100% - 12px));background:var(--ink);color:var(--paper);padding:.35em .6em;border-radius:8px;font-size:.85rem;white-space:nowrap;pointer-events:none}
.status{font-weight:600;font-size:.9rem}
.status.ready{display:inline-flex;align-items:center;gap:6px}
.tag{display:inline-block;font-style:normal;font-weight:700;font-size:.72rem;padding:.05em .45em;border-radius:5px;background:var(--ink);color:var(--paper);margin-left:4px;vertical-align:1px}
.pending{font-size:.8rem;color:var(--muted)}

/* builder */
.setrow{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.setrow label{font-weight:600;margin-right:8px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:600 .95rem var(--body);padding:.45em .85em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fam{padding:14px 0;border-top:1px solid var(--line)}
.fam-name{font-weight:700;font-size:1.05rem}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
@media (max-width:600px){.lv{grid-template-columns:1fr 1fr}}
.chip{position:relative;text-align:left;border:2px solid var(--line);border-left:8px solid var(--lc);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font:500 .93rem/1.2 var(--body);cursor:pointer;min-height:60px}
.chip small{display:block;font-weight:700;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.chip[aria-pressed="true"]{background:var(--lc);color:var(--lon);border-color:var(--lc)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.chip[aria-pressed="true"] .tag{background:var(--lon);color:var(--lc)}
.ord{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 .8rem var(--body);display:grid;place-items:center}
.cue{font-size:.92rem;color:var(--muted);margin:8px 0 0}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.dock-in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.cover{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cover span{font-size:.8rem;padding:.15em .6em;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.cover span.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* player */
.player{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--lc);color:var(--lon);padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.player.rest{background:var(--card);color:var(--ink);border-top:12px solid var(--lc)}
.p-bar{height:6px;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden}
.p-bar i{display:block;height:100%;background:currentColor}
.p-top{display:flex;justify-content:space-between;font-weight:600;margin-top:10px}
.p-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;width:100%;max-width:560px;margin:0 auto;padding:12px 0}
.p-phase{font-family:var(--display);font-weight:700;font-size:1.5rem}
.p-time{font-family:var(--display);font-weight:800;font-size:min(40vw,10.5rem);line-height:.92;font-variant-numeric:tabular-nums}
.p-name{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1.02}
.p-sub{font-weight:600;margin-top:4px}
.p-cue{max-width:38ch;opacity:.92}
.p-log p{margin:14px auto 8px}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper button{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 1.7rem var(--body);cursor:pointer}
.stepper input{width:110px;text-align:center;font:800 2.4rem var(--display);padding:.1em}
.p-next{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:6px}
.p-next b{font-family:var(--display);font-size:2rem;line-height:1}
.p-ctrl{display:flex;justify-content:center;gap:10px}
.pbtn{flex:1;max-width:150px;border:2px solid currentColor;background:transparent;color:inherit;font:600 1rem var(--body);padding:.7em;border-radius:999px;cursor:pointer}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-weight:700}
.lvtag{display:inline-block;padding:.1em .55em;border-radius:6px;font-weight:700;font-size:.82rem;background:var(--lc);color:var(--lon)}
input.num{width:80px;padding:.4em .5em}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:560px}
.rpe button{padding:.6em 0;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:700 1rem var(--body);cursor:pointer}
.rpe button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.clist{display:grid;gap:10px}
.ccard{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ccard b{font-family:var(--display);font-size:1.6rem}
.actions{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.7em 1.1em;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* workout of the week, challenges, fitness check, how-to */
.feature{border:2px solid var(--ink);margin-bottom:12px}
.feature .h3{margin:2px 0 4px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--l2)}
.bar.done i{background:var(--l1)}
.center{text-align:center}
.big-time{font-family:var(--display);font-weight:800;font-size:min(32vw,8rem);line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
input.score{max-width:200px;font:800 2rem var(--display)}
dialog.how{border:0;border-radius:var(--r);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);background:var(--card);color:var(--ink)}
dialog.how::backdrop{background:rgba(0,0,0,.55)}
.how-in{padding:20px}
.howlv{border-left:6px solid var(--lc);padding:2px 0 2px 12px;margin:14px 0}
.howlv p{margin:4px 0 8px}
.warn{background:var(--paper);border-radius:10px;padding:10px 12px}
.dfam{border:1px solid var(--line);border-radius:10px;padding:8px 12px 0;margin:10px 0}
.dfam legend{font-weight:700;padding:0 4px}
fieldset.plain{border:0;padding:0;margin:0 0 10px}
fieldset.plain legend{font-weight:600;margin-bottom:6px;padding:0}
.byclass{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.byclass span{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:.1em .65em}
.byclass span.mine{border:2px solid var(--ink);font-weight:600}
.yeargrp{border-top:1px solid var(--line);padding:8px 0 2px}
.yeargrp .check{margin:0 0 6px}
.forms{display:flex;flex-wrap:wrap;gap:2px 18px;padding-left:26px}
.forms .check{margin:0 0 6px}
.yearhead{font-family:var(--display);font-weight:700;font-size:1.2rem;margin:18px 0 8px;color:var(--muted)}
@media print{.top,.noprint,.dock,#toast,.demo,.offline{display:none!important}body{background:#fff;color:#000}.panel{border-color:#999}}
select.mv{width:auto;padding:.3em .5em;font-size:.9rem;border-radius:999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Demo mode: data is saved on this device only. Teacher PIN for the demo: 0000.</div>
<div id="offline" class="offline" hidden>You are offline. Workouts are saved on this device and upload when you reconnect.</div>
<header class="top">
  <button class="brand" id="brand" aria-label="Bodyweight Builder home">
    <span class="ladder" aria-hidden="true"><i style="height:7px;background:var(--l1)"></i><i style="height:12px;background:var(--l2)"></i><i style="height:17px;background:var(--l3)"></i><i style="height:22px;background:var(--l4)"></i></span>
    Bodyweight Builder
  </button>
  <div id="who"></div>
</header>
<main class="wrap" id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Settings =====
   The anon key is public by design. All data access goes through the bw_* functions
   in supabase/setup.sql, which check class codes, PINs and login tokens server-side.
   Leave both values empty to run in demo mode (data stays on this device). */
const CONFIG = {
  SUPABASE_URL: 'https://tufoatmpespwqeeklkhi.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1Zm9hdG1wZXNwd3FlZWtsa2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDIzNjQsImV4cCI6MjEwNjk3ODM2NH0.P6-CyS_1cqKISdhkoiH9_jvIfnFfWO7ekU2v93DJQBU'
};
const MIN_EX = 8, MAX_EX = 12;

/* ===== Exercise library: [name, unit ('reps' or 'sec'), cue] for levels 1 to 4 ===== */
const REGIONS = ['Legs','Upper body','Core','Cardio','Balance'];
const F = (id, name, region, levels) => ({ id, name, region, levels: levels.map(([n,u,c],i)=>({ n, u, c, lvl:i+1 })) });
const FAMILIES = [
  F('squat','Squat','Legs',[
    ['Squat','reps','Feet shoulder width apart, sit back until thighs are parallel, chest up.'],
    ['Jump squat','reps','Squat down, jump straight up, land softly back into the squat.'],
    ['Squat half turn jump','reps','Squat, jump and turn 180 degrees in the air, land facing the other way.'],
    ['Squat tuck jump','reps','Squat, jump and pull both knees to your chest, land softly.']]),
  F('lunge','Lunge','Legs',[
    ['Split squat','reps','One foot forward, one back. Lower the back knee towards the floor and stand up. Switch legs at halfway.'],

    ['Reverse lunge knee drive','reps','Reverse lunge, then drive the back knee up to hip height. Alternate legs.'],
    ['Jumping lunge','reps','Jump and switch legs in the air, land softly in a lunge.']]),
  F('lateral','Side lunge','Legs',[

    ['Side lunge','reps','Big step to the side, bend that knee, keep the other leg straight. Alternate sides.'],
    ['Skater step','reps','Step diagonally behind you and swing the arms like a speed skater. Alternate sides.'],

  F('bridge','Glute bridge','Legs',[
    ['Glute bridge','reps','Lie on your back, knees bent, squeeze your glutes to lift the hips.'],
    ['Bridge march','reps','Hold the bridge and lift one foot at a time, hips stay level.'],
    ['Single-leg bridge','reps','One foot on the floor, other leg straight up, lift the hips. Switch at halfway.'],
    ['Single-leg bridge 3s squeeze','reps','Single-leg bridge with a 3-second squeeze at the top. Switch at halfway.']]),
  F('calf','Calf raise','Legs',[
    ['Calf raise','reps','Rise onto your toes, pause, lower slowly.'],
    ['Single-leg calf raise','reps','Same on one leg, hand on a wall for balance. Switch at halfway.'],
    ['Pogo hops','reps','Small fast bounces on the balls of your feet with stiff ankles.'],
    ['Single-leg pogo hops','reps','Pogo hops on one leg. Switch at halfway.']]),
  F('wallsit','Wall sit','Legs',[
    ['High wall sit','sec','Back flat on the wall, knees bent about halfway, hold.'],
    ['Wall sit','sec','Thighs parallel to the floor, knees above ankles, hold.'],
    ['Wall sit arms overhead','sec','Parallel wall sit with arms straight above your head.'],
    ['Single-leg wall sit','sec','Parallel wall sit with one foot lifted. Switch at halfway.']]),

  F('pushup','Push-up','Upper body',[
    ['Wall push-up','reps','Hands on the wall at chest height, body straight, bend and push.'],
    ['Knee push-up','reps','On your knees, body straight from knees to head, chest to the floor.'],
    ['Push-up','reps','On your toes, body straight, chest close to the floor, push up.'],
    ['Push-up shoulder taps','reps','One push-up, then tap each shoulder. Count each push-up.']]),
  F('dip','Floor dip','Upper body',[
    ['Tabletop hold','sec','Hands and feet on the floor, belly up, hips level with knees, hold.'],
    ['Floor dip','reps','Sit with hands behind you, lift the hips, bend and straighten the elbows.'],
    ['Crab toe touch','reps','In crab position, touch each hand to the opposite foot.'],
    ['Single-leg floor dip','reps','Floor dip with one leg straight in the air. Switch at halfway.']]),
  F('pike','Pike','Upper body',[
    ['Downward dog hold','sec','Hands and feet on the floor, hips high, push the floor away, hold.'],
    ['Downward dog shoulder taps','reps','In downward dog, tap each hand to the opposite shoulder.'],
    ['Pike push-up','reps','Hips high, bend the elbows to bring your head towards the floor.'],
    ['Slow pike push-up','reps','Pike push-up taking 3 seconds to lower.']]),
  F('bear','Bear crawl','Upper body',[
    ['Bear hold','sec','On hands and toes, knees hovering just above the floor, hold.'],
    ['Bear hold shoulder taps','reps','In the bear hold, tap each hand to the opposite shoulder.'],
    ['Bear crawl','reps','Crawl 4 steps forward and 4 back with knees low. Count each length.'],
    ['Bear crawl push-up','reps','Crawl 2 steps forward, do a push-up, crawl back. Count each push-up.']]),

  F('plank','Plank','Core',[
    ['Knee plank','sec','On forearms and knees, body straight, hold.'],
    ['Forearm plank','sec','On forearms and toes, body straight, hold.'],
    ['Plank leg lift','reps','Forearm plank, lift one leg at a time, hips stay still.'],
    ['Plank up-down','reps','Move from forearms to hands and back down, one arm at a time.']]),
  F('sideplank','Side plank','Core',[
    ['Knee side plank','sec','On one forearm and knees, hips lifted. Switch sides at halfway.'],
    ['Side plank','sec','On one forearm and feet, body straight. Switch sides at halfway.'],
    ['Side plank hip dips','reps','Lower the hip to tap the floor and lift. Switch sides at halfway.'],
    ['Star side plank','sec','Side plank with the top arm and leg lifted. Switch sides at halfway.']]),
  F('crunch','Crunch','Core',[
    ['Crunch','reps','Knees bent, lift your shoulders off the floor, lower slowly.'],
    ['Bicycle crunch','reps','Elbow towards the opposite knee, alternate sides.'],
    ['Tuck-up','reps','Balance on your bottom, pull knees and chest together, then extend.'],
    ['V-up','reps','Lift straight legs and arms to meet above your hips.']]),
  F('hollow','Hollow body','Core',[
    ['Dead bug','reps','On your back, lower the opposite arm and leg, lower back stays on the floor.'],

const normYear = v => { const s = String(v ?? '').replace(/\s+/g, ' ').trim(); const m = s.match(/^(?:year|yr|y)?\s*(\d{1,2})$/i); return m ? `Year ${+m[1]}` : s; };

const Local = {
  _load(){ const d = ls.get('bwb-data', null) || {}; return {classes:[],students:[],sessions:[],teacher_pin:'0000',...d}; },
  _save(d){ try{ localStorage.setItem('bwb-data', JSON.stringify(d)); }catch(e){ throw new Error('Could not save on this device.'); } },
  _me(d, s){ const c=d.classes.find(x=>x.id===s.class_id); return {student:{id:s.id,name:s.name}, cls:{id:c.id,name:c.name,weekly_goal:c.weekly_goal||3}}; },
  _stu(tok){ const d=this._load(), s=d.students.find(x=>'local-s:'+x.id===tok); if(!s) throw new Error('Your session has expired. Please log in again.'); return [d,s]; },
  _t(tok){ if(tok!=='local-t') throw new Error('Your teacher session has expired. Please log in again.'); return this._load(); },
  async listClasses(){ return this._load().classes.map(({id,name,year_group})=>({id,name,year_group:year_group||null})).sort(byName); },
  async listStudents(cid, code){
    const d=this._load(), c=d.classes.find(x=>x.id===cid);
    if(!c || norm(c.code)!==norm(code)) throw new Error('That class code is not right. Check with your teacher.');
    return d.students.filter(s=>s.class_id===cid).map(s=>({id:s.id,name:s.name,has_pin:!!s.pin})).sort(byName);
  },
  async studentLogin(id, code, pin){
    const d=this._load(), s=d.students.find(x=>x.id===id);
    if(!s) throw new Error('Name not found. Ask your teacher.');
    if(norm(d.classes.find(x=>x.id===s.class_id)?.code)!==norm(code)) throw new Error('That class code is not right. Check with your teacher.');
    if(!/^\d{4}$/.test(pin)) throw new Error('Your PIN must be 4 digits.');
    if(s.pin && s.pin!==pin) throw new Error('Wrong PIN. Ask your teacher to reset it if you forgot.');
    if(!s.pin){ s.pin=pin; this._save(d); }
    return {token:'local-s:'+s.id, ...this._me(d,s)};
  },
  async me(tok){ const [d,s]=this._stu(tok); return this._me(d,s); },
  async logout(){},
  async mySessions(tok){ const [d,s]=this._stu(tok); return d.sessions.filter(x=>x.student_id===s.id).sort(newestFirst); },
  async addSession(tok, p){
    const [d,s]=this._stu(tok), c=d.classes.find(x=>x.id===s.class_id);
    const {done_at, ...rest} = p;
    const row = {...rest, ...totals(p.exercises), id:uid(), class_id:c.id, class_name:c.name, student_id:s.id, student_name:s.name, created_at:done_at||new Date().toISOString()};
    d.sessions.push(row); this._save(d); return row;
  },
  async teacherLogin(pin){ if(pin!==this._load().teacher_pin) throw new Error('Wrong teacher PIN.'); return {token:'local-t'}; },
  async tChangePin(tok, o, n){ const d=this._t(tok); if(o!==d.teacher_pin) throw new Error('Your current PIN is not right.'); if(n.length<6) throw new Error('The new PIN must be at least 6 characters.'); d.teacher_pin=n; this._save(d); },
  async tClasses(tok){ const d=this._t(tok); return d.classes.map(c=>({...c, weekly_goal:c.weekly_goal||3, students:d.students.filter(s=>s.class_id===c.id).length, workouts:d.sessions.filter(s=>s.class_id===c.id).length})).sort(byName); },
  async tAddClass(tok, name, code, goal, year){ const d=this._t(tok); if(!name || code.length<3) throw new Error('Enter a class name and a class code of at least 3 characters.'); const c={id:uid(),name,code,weekly_goal:goal,year_group:normYear(year)||null,created_at:new Date().toISOString()}; d.classes.push(c); this._save(d); return c.id; },
  async tUpdateClass(tok, id, name, code, goal, year){ const d=this._t(tok), c=d.classes.find(x=>x.id===id); if(!name) throw new Error('The class needs a name.'); if(code.length<3) throw new Error('The class code needs at least 3 characters.'); if(c){ c.name=name; c.code=code; c.weekly_goal=goal; c.year_group=normYear(year)||null; } this._save(d); },
  async tDeleteClass(tok, id){ const d=this._t(tok); d.classes=d.classes.filter(c=>c.id!==id); d.students=d.students.filter(s=>s.class_id!==id); d.sessions=d.sessions.filter(s=>s.class_id!==id); d.plans=(d.plans||[]).filter(p=>p.class_id!==id); d.tests=(d.tests||[]).filter(t=>t.class_id!==id); this._save(d); },
  async tStudents(tok, cid){ const d=this._t(tok); return d.students.filter(s=>s.class_id===cid).map(s=>({id:s.id,name:s.name,has_pin:!!s.pin})).sort(byName); },
  async tAddStudents(tok, cid, names){
    const d=this._t(tok), have=new Set(d.students.filter(s=>s.class_id===cid).map(s=>norm(s.name))); let n=0;
    names.forEach(name=>{ if(!have.has(norm(name))){ d.students.push({id:uid(),class_id:cid,name,pin:null}); have.add(norm(name)); n++; } });
    this._save(d); return n;
  },
  async tResetPin(tok, id){ const d=this._t(tok), s=d.students.find(x=>x.id===id); if(s) s.pin=null; this._save(d); },
  async tAllStudents(tok){ return this._t(tok).students.map(s=>({id:s.id, name:s.name, class_id:s.class_id})); },
  async tMoveStudents(tok, to, ids){
    const d=this._t(tok), c=d.classes.find(x=>x.id===to); if(!c) throw new Error('Class not found.');
    const taken = new Set(d.students.filter(s=>s.class_id===to).map(s=>norm(s.name))); let n=0;
    d.students.forEach(s=>{
      if(!ids.includes(s.id) || s.class_id===to || taken.has(norm(s.name))) return;
      s.class_id=to; taken.add(norm(s.name)); n++;
      d.sessions.forEach(x=>{ if(x.student_id===s.id){ x.class_id=to; x.class_name=c.name; } });
      (d.tests||[]).forEach(t=>{ if(t.student_id===s.id) t.class_id=to; });
    });
    this._save(d); return n;
  },
  async tRemoveStudent(tok, id){ const d=this._t(tok); d.students=d.students.filter(s=>s.id!==id); d.sessions.forEach(s=>{ if(s.student_id===id) s.student_id=null; }); this._save(d); },
  async tSessions(tok, cid){ return this._t(tok).sessions.filter(s=>s.class_id===cid).sort(newestFirst); },
  _plan(d, cid){ const p=(d.plans||[]).filter(x=>x.class_id===cid && x.active).sort(newestFirst)[0]; return p ? {...p} : null; },
  _inCh: (ch, c) => ch.class_ids.includes(c.id) || (!!c.year_group && (ch.year_groups||[]).some(y=>norm(y)===norm(c.year_group))),
  _chl(d, ch){
    const count = ss => ch.metric==='workouts' ? ss.length : ch.metric==='reps' ? sum(ss.map(s=>s.total_reps)) : Math.floor(sum(ss.map(s=>s.duration_sec))/60);
    const by_class = d.classes.filter(c=>this._inCh(ch, c)).sort(byName).map(c=>({id:c.id, name:c.name,
      progress:count(d.sessions.filter(s=>s.class_id===c.id && ymd(s.created_at)>=ch.starts_on && ymd(s.created_at)<=ch.ends_on))}));
    return {...ch, year_groups:ch.year_groups||[], by_class, classes:by_class.map(b=>b.name), progress:sum(by_class.map(b=>b.progress))};
  },
  _testsAsc: a => [...a].sort((x,y)=>x.created_at.localeCompare(y.created_at)),
  async studentExtras(tok){
    const [d,s]=this._stu(tok), c=d.classes.find(x=>x.id===s.class_id), today=ymd(new Date()), cutoff=ymd(addDays(-14));
    return { plan:this._plan(d,c.id), test_label:c.test_label||null,
      tests:this._testsAsc((d.tests||[]).filter(t=>t.student_id===s.id)),
      challenges:(d.challenges||[]).filter(ch=>this._inCh(ch, c) && ch.starts_on<=today && ch.ends_on>=cutoff).map(ch=>this._chl(d,ch)).sort((a,b)=>a.ends_on.localeCompare(b.ends_on)) };
  },
  async addTest(tok, r){
    const [d,s]=this._stu(tok), c=d.classes.find(x=>x.id===s.class_id);
    if(!c.test_label) throw new Error('There is no fitness check open right now.');
    (d.tests ||= []).push({id:uid(), class_id:c.id, student_id:s.id, student_name:s.name, label:c.test_label, results:{...r}, created_at:new Date().toISOString()});
    this._save(d);
  },
  async listDemos(){ return Object.entries(this._load().demos||{}).map(([exercise_key,url])=>({exercise_key,url})); },
  async tSetDemo(tok, key, url){
    const d=this._t(tok); d.demos ||= {};
    if(!url) delete d.demos[key];
    else if(!/^https:\/\//i.test(url)) throw new Error('The link must start with https://');
    else d.demos[key]=url;
    this._save(d);
  },
  async tSetPlan(tok, cid, p){ const d=this._t(tok); d.plans ||= []; d.plans.forEach(x=>{ if(x.class_id===cid) x.active=false; }); d.plans.push({...p, id:uid(), class_id:cid, active:true, created_at:new Date().toISOString()}); this._save(d); },
  async tClearPlan(tok, cid){ const d=this._t(tok); (d.plans||[]).forEach(x=>{ if(x.class_id===cid) x.active=false; }); this._save(d); },
  async tClassExtras(tok, cid){ const d=this._t(tok); return {plan:this._plan(d,cid), test_label:d.classes.find(c=>c.id===cid)?.test_label||null, tests:this._testsAsc((d.tests||[]).filter(t=>t.class_id===cid))}; },
  async tSetTestLabel(tok, cid, label){ const d=this._t(tok), c=d.classes.find(x=>x.id===cid); if(c) c.test_label=(label||'').trim()||null; this._save(d); },
  async tChallenges(tok){ const d=this._t(tok); return (d.challenges||[]).map(ch=>this._chl(d,ch)).sort((a,b)=>b.ends_on.localeCompare(a.ends_on)); },
  async tAddChallenge(tok, ch){
    const d=this._t(tok);
    if(!ch.title) throw new Error('Give the challenge a title.');

/* ===== Progress analysis ===== */
// Level-up rule, per movement, at the highest level reached:
//   holds: held the full work time in every round in the last two workouts at that level
//   reps:  done at that level at least twice, the last one matched or beat the best reps-per-minute
//          at that level, and the workout felt manageable (effort 7 or less)
function analyse(sessions){
  const asc = [...sessions].sort((a,b)=>a.created_at.localeCompare(b.created_at));
  const fams = {}, pb = {};
  asc.forEach(s=>s.exercises.forEach(e=>{
    const fid = famIdOf(e); if(!fid) return;
    const f = fams[fid] ||= {fid, level:0, hist:{}};
    const res = e.results.map(Number);
    const entry = { at:s.created_at, rpe:s.rpe, unit:e.unit, best:Math.max(...res),
      rate: e.unit==='reps' ? sum(res)/(res.length*s.work_sec)*60 : 0,
      full: e.unit==='sec' && res.every(v=>v>=s.work_sec) };
    f.level = Math.max(f.level, e.level);
    (f.hist[e.level] ||= []).push(entry);
    pb[e.name] = Math.max(pb[e.name] ?? 0, entry.best);
  }));
  Object.values(fams).forEach(f=>{
    const L = f.hist[f.level], last = L[L.length-1], prev = L.slice(0,-1);
    f.unit = last.unit; f.best = Math.max(...L.map(x=>x.best)); f.times = L.length; f.last = last.at;
    const ready = L.length>=2 && (last.unit==='sec'
      ? last.full && L[L.length-2].full
      : last.rate >= Math.max(...prev.map(x=>x.rate)) && last.rpe<=7);
    f.status = f.level>=4 ? (ready ? 'mastered' : 'top') : ready ? 'ready' : 'working';
  });
  return {fams, pb};
}
const weekStart = d => { const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x.getTime(); };
function weekStats(sessions, goal){
  const counts = new Map();
  sessions.forEach(s=>{ const k=weekStart(s.created_at); counts.set(k,(counts.get(k)||0)+1); });
  const now = weekStart(Date.now()), thisWeek = counts.get(now)||0;
  const d = new Date(now); if(thisWeek < goal) d.setDate(d.getDate()-7);
  let streak = 0;
  while((counts.get(weekStart(d))||0) >= goal){ streak++; d.setDate(d.getDate()-7); }
  return {thisWeek, streak};
}
const readyCount = A => Object.values(A.fams).filter(f=>f.status==='ready').length;
function statusHTML(f){
  if(f.status==='ready') return `<span class="status ready">Ready for <span class="lvtag" style="${lc(f.level+1)}">Level ${f.level+1}</span></span>`;
  if(f.status==='mastered') return `<span class="status">Top level mastered</span>`;
  if(f.status==='top') return `<span class="status">Top level, keep improving</span>`;
  return `<span class="status muted">Keep going</span>`;
}

/* ===== Progress view (shared by student and teacher) ===== */
const CH = {W:420, H:190, L:34, R:12, T:14, B:28};
const chX = (i,n) => CH.L + (n<2 ? 0 : i*(CH.W-CH.L-CH.R)/(n-1));
const chY = v => CH.T + (4-v)*(CH.H-CH.T-CH.B)/3;
function levelChart(sessions){
  const pts = [...sessions].sort((a,b)=>a.created_at.localeCompare(b.created_at)).slice(-20).map(s=>({v:avgLvl(s), d:s.created_at}));
  if(pts.length < 2) return `<p class="muted">The level chart appears after your second workout.</p>`;
  const n = pts.length, path = pts.map((p,i)=>`${i?'L':'M'}${chX(i,n).toFixed(1)},${chY(p.v).toFixed(1)}`).join('');
  return `<div class="chart" data-pts='${esc(JSON.stringify(pts))}'>
    <svg viewBox="0 0 ${CH.W} ${CH.H}" role="img" aria-label="Average level per workout, last ${n} workouts: from ${pts[0].v} to ${pts[n-1].v}">
      ${[1,2,3,4].map(l=>`<line class="grid" x1="${CH.L}" x2="${CH.W-CH.R}" y1="${chY(l)}" y2="${chY(l)}"/><text class="ax" x="${CH.L-8}" y="${chY(l)+4}" text-anchor="end">L${l}</text>`).join('')}
      <text class="ax" x="${CH.L}" y="${CH.H-6}">${fmtShort(pts[0].d)}</text>
      <text class="ax" x="${CH.W-CH.R}" y="${CH.H-6}" text-anchor="end">${fmtShort(pts[n-1].d)}</text>
      <path class="ln" d="${path}"/>
      ${pts.map((p,i)=>`<circle class="pt" cx="${chX(i,n).toFixed(1)}" cy="${chY(p.v).toFixed(1)}" r="4.5"/>`).join('')}
      <circle class="hl" r="6.5" visibility="hidden"/>
    </svg><div class="tip" hidden></div></div>`;
}
function wireCharts(){
  $$('.chart').forEach(ch=>{
    const pts = JSON.parse(ch.dataset.pts), n = pts.length, svg = ch.querySelector('svg'), tip = ch.querySelector('.tip'), hl = ch.querySelector('.hl');
    svg.onpointermove = ev => {
      const r = svg.getBoundingClientRect(), vx = (ev.clientX-r.left)/r.width*CH.W;
      const i = Math.max(0, Math.min(n-1, Math.round((vx-CH.L)/((CH.W-CH.L-CH.R)/(n-1)))));
      const x = chX(i,n), y = chY(pts[i].v);
      hl.setAttribute('cx',x); hl.setAttribute('cy',y); hl.setAttribute('visibility','visible');
      tip.textContent = `${fmtShort(pts[i].d)}: average level ${pts[i].v}`;
      tip.style.left = (x/CH.W*100)+'%'; tip.style.top = (y/CH.H*100)+'%'; tip.hidden = false;
    };
    svg.onpointerleave = () => { tip.hidden = true; hl.setAttribute('visibility','hidden'); };
  });
}

    : `<p>${you?'No workouts yet. Build your first one.':'No workouts yet.'}</p>`}`;
}

const seg = (k,label,opts,suf) => `<span><label>${label}</label><span class="seg" role="group" aria-label="${label}">${opts.map(v=>`<button type="button" data-set="${k}" data-val="${v}" aria-pressed="${S.settings[k]===v}">${v}${suf}</button>`).join('')}</span></span>`;
function famRow(f){
  const me = S.A?.fams[f.id];
  const tag = l => !me ? '' : l===me.level ? '<em class="tag">Your level</em>' : (me.status==='ready' && l===me.level+1) ? '<em class="tag">Try this</em>' : '';
  return `<div class="fam" data-fam="${f.id}">
    <div class="fam-name">${esc(f.name)} <button type="button" class="link small" data-how="${f.id}">How to</button>${me?` <span class="muted small">best ${me.best}${unitWord(me.unit)} at level ${me.level}</span>`:''}</div>
    <div class="lv">${f.levels.map(l=>`<button type="button" class="chip" data-fam="${f.id}" data-lvl="${l.lvl}" style="${lc(l.lvl)}" aria-pressed="false"><small>Level ${l.lvl}${l.u==='sec'?', hold':''}${tag(l.lvl)}</small>${esc(l.n)}<span class="ord" hidden></span></button>`).join('')}</div>
    <p class="cue" hidden></p>
  </div>`;
}
function showBuilder(){
  const T = S.planFor;
  setView(`${T ? `<p><button class="btn ghost small" id="cancelPlan">Back to ${esc(T.name)}</button></p>
      <h1>Workout of the week</h1>
      <p class="muted">For ${esc(T.name)}. Pick 8 to 12 exercises at the level most of the class can manage. Students can do it as set or at their own levels.</p>
      <div class="panel"><label class="field"><span>Title</span><input id="ptitle" maxlength="80" value="${esc(T.plan?.title || 'Workout of the week')}"></label>
        <label class="field" style="margin:0"><span>Message to students (optional)</span><textarea id="pnote" rows="2" maxlength="500" placeholder="e.g. Core focus before our gymnastics unit">${esc(T.plan?.note || '')}</textarea></label></div>`
    : `<h1>Build your workout</h1>
      <p class="muted">Pick one level per movement, 8 to 12 exercises in total. They run in the order you pick them. For a full-body session, include Legs, Upper body and Core.${S.A && Object.keys(S.A.fams).length ? ' <b>Your level</b> shows where you are, <b>Try this</b> means you are ready to step up.' : ''} Tap <b>How to</b> to see how each exercise is done.</p>
      ${S.planId ? `<p class="panel small" style="max-width:none">Your teacher's workout of the week is loaded. Tap another level on any exercise to make it easier or harder.</p>` : ''}`}
    <div class="panel setrow" style="margin-top:12px">${seg('work','Work',[30,40,45],'s')}${seg('rest','Rest',[15,20,30],'s')}${seg('rounds','Rounds',[1,2,3],'')}</div>
    ${REGIONS.map(r=>`<h2>${r}</h2>` + FAMILIES.filter(f=>f.region===r).map(famRow).join('')).join('')}
    <div class="dock" id="dock"></div>`);
  view.onclick = e => {
    const how = e.target.closest('[data-how]');
    if(how) return showHow(how.dataset.how);
    const chip = e.target.closest('.chip');
    if(chip) return toggleEx(chip.dataset.fam, +chip.dataset.lvl);
    const sb = e.target.closest('[data-set]');
    if(sb){ S.settings[sb.dataset.set] = +sb.dataset.val; $$(`[data-set="${sb.dataset.set}"]`).forEach(b=>b.setAttribute('aria-pressed', b===sb)); refreshBuilder(); }
  };
  if(T) $('#cancelPlan').onclick = () => showClass(T);
  refreshBuilder();
}
function toggleEx(fam, lvl){
  const i = S.sel.findIndex(x=>x.fam===fam);
  if(i>-1){ if(S.sel[i].lvl===lvl) S.sel.splice(i,1); else S.sel[i].lvl=lvl; }
  else { if(S.sel.length>=MAX_EX) return toast(`Maximum ${MAX_EX} exercises. Remove one first.`); S.sel.push({fam,lvl}); }
  refreshBuilder();
}
function refreshBuilder(){
  $$('.chip').forEach(b=>{
    const i = S.sel.findIndex(x=>x.fam===b.dataset.fam && x.lvl===+b.dataset.lvl);
    b.setAttribute('aria-pressed', i>-1);
    const o=b.querySelector('.ord'); o.hidden = i<0; o.textContent = i+1;
  });
  $$('.fam').forEach(row=>{
    const s = S.sel.find(x=>x.fam===row.dataset.fam), cue=row.querySelector('.cue');
    cue.hidden = !s; if(s) cue.textContent = FAM[s.fam].levels[s.lvl-1].c;
  });
  const n=S.sel.length, {work,rest,rounds}=S.settings;
  const mins = Math.round((10 + rounds*n*work + Math.max(0,rounds*n-1)*rest)/60);
  const cov = REGIONS.map(r=>({r, c:S.sel.filter(x=>FAM[x.fam].region===r).length}));
  $('#dock').innerHTML = `<div class="dock-in">
    <div><b>${n} chosen</b> <span class="muted">${n<MIN_EX ? `pick ${MIN_EX-n} more` : `about ${mins} min`}</span>
      <div class="cover">${cov.map(o=>`<span class="${o.c?'on':''}">${o.r} ${o.c}</span>`).join('')}</div></div>
    <div class="actions">${n?'<button class="btn ghost small" id="clear">Clear</button>':''}<button class="btn" id="start" ${n<MIN_EX||n>MAX_EX?'disabled':''}>${S.planFor?'Publish':'Start'}</button></div></div>`;
  $('#start').onclick = S.planFor ? publishPlan : startWorkout;
  if($('#clear')) $('#clear').onclick = () => { S.sel = []; S.planId = null; refreshBuilder(); };
}
async function publishPlan(){
  const c = S.planFor, title = $('#ptitle').value.trim();
  if(!title) return toast('Give the workout a title.');
  const {work,rest,rounds} = S.settings;
  const plan = {title, note:$('#pnote').value.trim(), work_sec:work, rest_sec:rest, rounds, exercises:S.sel.map(x=>({fid:x.fam, lvl:x.lvl}))};
  $('#start').disabled = true;
  try{ await Store.tSetPlan(S.teacher, c.id, plan); toast(`Published to ${c.name}`); S.sel = []; showClass(c); }
  catch(e){ $('#start').disabled = false; fail('Could not publish', e); }
}

/* ===== Workout player ===== */
let P=null, audio=null, wake=null, timerId=null;
function beep(f=880,d=.12,delay=0){
  try{ if(!audio) return; const o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime+delay;
    o.frequency.value=f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.start(t); o.stop(t+d);
  }catch(e){}
}
async function keepAwake(){ try{ wake = await navigator.wakeLock?.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', () => { if(P && timerId && document.visibilityState==='visible') keepAwake(); });
async function startWorkout(){
  try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume && audio.resume(); }catch(e){}
  keepAwake();
  const {work,rest,rounds} = S.settings;
  const ex = S.sel.map(s=>{ const f=FAM[s.fam], l=f.levels[s.lvl-1]; return {fid:f.id, family:f.name, name:l.n, level:l.lvl, unit:l.u, cue:l.c, half:/halfway/i.test(l.c), results:Array(rounds).fill(null)}; });
  const phases = [{type:'ready', dur:10, ex:0, round:0}];
  for(let r=0;r<rounds;r++) ex.forEach((_,i)=>{
    phases.push({type:'work', dur:work, ex:i, round:r});
    if(!(r===rounds-1 && i===ex.length-1)) phases.push({type:'rest', dur:rest, ex:i, round:r});
  });
  P = {ex, phases, i:-1, started:Date.now(), paused:false, planId:S.planId};
  const el=document.createElement('div'); el.id='player'; el.className='player';
  el.setAttribute('role','dialog'); el.setAttribute('aria-label','Workout timer');
  document.body.appendChild(el); document.body.style.overflow='hidden';
  startPhase(0); timerId = setInterval(tick,200);
}
function startPhase(i){
  P.i=i; const ph=P.phases[i];
  if(!ph) return finishWorkout();
  if(ph.type==='rest'){
    const e=P.ex[ph.ex];
    if(e.results[ph.round]==null) e.results[ph.round] = e.unit==='sec' ? S.settings.work : (ph.round>0 && e.results[ph.round-1]!=null ? e.results[ph.round-1] : 0);
  }
  P.end = Date.now()+ph.dur*1000; P.shown=null; P.paused=false; P.halfDone=false;
  renderPhase();
}
function renderPhase(){
  const ph=P.phases[P.i], e=P.ex[ph.ex], el=$('#player'), N=P.ex.length, R=S.settings.rounds;
  const nw = P.phases.slice(P.i+1).find(p=>p.type==='work'), ne = nw ? P.ex[nw.ex] : null;
  let main='';
  if(ph.type==='rest'){
    el.className='player rest'; el.style.cssText = lc(ne?ne.level:e.level);
    main = `<div class="p-phase">Rest</div><div class="p-time" id="pt">${ph.dur}</div>
      <div class="p-log"><p><b>${esc(e.name)}</b>: ${e.unit==='sec'?'seconds held':'reps done'}</p>
        <div class="stepper"><button type="button" data-d="-1" aria-label="One less">−</button><input id="sv" type="number" inputmode="numeric" min="0" value="${e.results[ph.round]}" aria-label="Your score"><button type="button" data-d="1" aria-label="One more">+</button></div></div>
      ${ne?`<div class="p-next"><span class="muted">Next</span><b>${esc(ne.name)}</b><span class="lvtag" style="${lc(ne.level)}">Level ${ne.level}</span><button type="button" class="link small" id="howp">How to do it</button></div>`:''}`;
  } else {
    el.className='player'; el.style.cssText = lc(e.level);
    const label = ph.type==='ready' ? 'Get ready' : (e.unit==='sec' ? 'Hold' : 'Go, count your reps');
    main = `<div class="p-phase" id="pph">${label}</div><div class="p-time" id="pt">${ph.dur}</div>
      <div class="p-name">${esc(e.name)}</div><div class="p-sub">Level ${e.level}</div><p class="p-cue">${esc(e.cue)}</p>
      <button type="button" class="link" id="howp">How to do it</button>`;
  }
  el.innerHTML = `<div class="p-bar"><i style="width:${Math.round(P.i/P.phases.length*100)}%"></i></div>
    <div class="p-top"><span>Round ${ph.round+1} of ${R}</span><span>Exercise ${ph.ex+1} of ${N}</span></div>
    <div class="p-main">${main}</div>
    <div class="p-ctrl"><button class="pbtn" id="pp">${P.paused?'Resume':'Pause'}</button><button class="pbtn" id="skip">Skip</button><button class="pbtn" id="quit">Quit</button></div>`;
  $('#pp').onclick = togglePause;
  if($('#howp')) $('#howp').onclick = () => { const x = ph.type==='rest' ? ne : e; if(!P.paused) togglePause(); showHow(x.fid, x.level); };
  $('#skip').onclick = () => startPhase(P.i+1);
  $('#quit').onclick = () => { if(confirm('Quit this workout? Nothing will be saved.')){ cleanupPlayer(); showBuilder(); } };
  if(ph.type==='rest'){
    const inp=$('#sv'), set=v=>{ const n=Math.max(0, parseInt(v,10)||0); e.results[ph.round]=n; inp.value=n; };
    inp.oninput = () => { e.results[ph.round] = Math.max(0, parseInt(inp.value,10)||0); };
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>set((e.results[ph.round]||0)+(+b.dataset.d)));
  }
}
function tick(){
  if(!P || P.paused) return;
  const ph=P.phases[P.i], ms=P.end-Date.now(), s=Math.max(0,Math.ceil(ms/1000));
  if(s!==P.shown){ P.shown=s; const t=$('#pt'); if(t) t.textContent=s; if(s>0 && s<=3) beep(660,.1); }
  if(ph.type==='work' && P.ex[ph.ex].half && !P.halfDone && s<=Math.floor(ph.dur/2) && s>3){
    P.halfDone=true; beep(880,.12); beep(880,.12,.2);
    const t=$('#pph'); if(t) t.textContent='Switch sides';
  }
  if(ms<=0){ beep(1046,.35); startPhase(P.i+1); }
}
function togglePause(){
  if(P.paused){ P.end=Date.now()+P.left; P.paused=false; }
  else { P.left=P.end-Date.now(); P.paused=true; }
  $('#pp').textContent = P.paused ? 'Resume' : 'Pause';
}
function cleanupPlayer(){
  clearInterval(timerId); timerId=null;
  $('#player')?.remove(); document.body.style.overflow='';
  try{ wake?.release(); }catch(e){} wake=null;
}
function finishWorkout(){
  P.duration = Math.round((Date.now()-P.started)/1000);
  P.doneAt = new Date().toISOString();
  cleanupPlayer(); showSummary();
}

/* ===== Summary and save ===== */
function showSummary(){
  const {work,rest,rounds}=S.settings, prevPB = S.A?.pb || {}; let rpe=null;
  P.ex.forEach(e=>{ e.results = e.results.map(v => v==null ? (e.unit==='sec'?work:'') : v); });
  const pbCell = e => {
    const best = Math.max(...e.results.map(v=>+v||0)), before = prevPB[e.name];
    if(before==null) return `<span class="muted">First time</span>`;
    return best > before ? `<b>New best!</b> <span class="muted">was ${before}</span>` : `<span class="muted">${before}</span>`;
  };
  setView(`<h1>Workout done</h1>
    <p class="muted">Check your scores, rate how hard it felt, then save.</p>
    <div class="tbl-wrap panel"><table>
      <thead><tr><th>Exercise</th><th>Level</th>${Array.from({length:rounds},(_,r)=>`<th>Round ${r+1}</th>`).join('')}<th>Personal best</th></tr></thead>
      <tbody>${P.ex.map((e,i)=>`<tr><td>${esc(e.name)}<div class="muted small">${e.unit==='sec'?'seconds':'reps'}</div></td>
        <td><span class="lvtag" style="${lc(e.level)}">Level ${e.level}</span></td>
        ${e.results.map((v,r)=>`<td><input class="num" type="number" min="0" inputmode="numeric" data-i="${i}" data-r="${r}" value="${v}" aria-label="${esc(e.name)} round ${r+1}"></td>`).join('')}
        <td id="pb${i}">${pbCell(e)}</td></tr>`).join('')}</tbody>
    </table></div>
    <h2>How hard was it?</h2><p class="muted">1 is very easy, 10 is maximum effort.</p>
    <div class="rpe">${Array.from({length:10},(_,k)=>`<button type="button" data-rpe="${k+1}" aria-pressed="false">${k+1}</button>`).join('')}</div>
    <p style="margin-top:26px"><button class="btn" id="save">Save workout</button> <button class="btn ghost" id="discard">Discard</button></p>`);
  $$('input.num').forEach(inp=>inp.oninput=()=>{
    const i=+inp.dataset.i; P.ex[i].results[+inp.dataset.r] = inp.value==='' ? '' : Math.max(0,parseInt(inp.value,10)||0);
    $('#pb'+i).innerHTML = pbCell(P.ex[i]);
  });
  $$('[data-rpe]').forEach(b=>b.onclick=()=>{ rpe=+b.dataset.rpe; $$('[data-rpe]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  $('#discard').onclick = () => { if(confirm('Discard this workout?')) showStudentHome(); };
  $('#save').onclick = async () => {
    if(P.ex.some(e=>e.results.some(v=>v===''))) return toast('Fill in every score.');
    if(!rpe) return toast('Choose how hard it felt, from 1 to 10.');
    const exercises = P.ex.map(e=>({fid:e.fid, family:e.family, name:e.name, level:e.level, unit:e.unit, results:e.results.map(Number)}));
    const sess = { work_sec:work, rest_sec:rest, rounds, exercises, duration_sec:P.duration, rpe, done_at:P.doneAt, ...(P.planId ? {plan_id:P.planId} : {}) };
    const pbs = exercises.filter(e=>prevPB[e.name]!=null && Math.max(...e.results)>prevPB[e.name]).length;
    const msg = `Workout saved${pbs?`. ${pbs} new personal best${pbs===1?'':'s'}!`:''}`;
    $('#save').disabled = true;
    try{ await Store.addSession(S.token, sess); toast(msg); showStudentHome(); }
    catch(e){
      if(isNetErr(e)){ pending.add(sess); toast('No connection. The workout is saved on this device and uploads when you are back online.'); return showStudentHome(); }
      $('#save').disabled=false; fail('Could not save', e);
    }
  };
}

  const days = Math.round((new Date(ch.ends_on+'T00:00') - new Date(today+'T00:00'))/864e5) + 1;

  const by = ch.by_class || [], picked = by.filter(b=>(ch.class_ids||[]).includes(b.id)).map(b=>b.name);

    <div class="between small"><span><b>${num(ch.progress)}</b> of ${num(ch.target)} ${METRIC[ch.metric]}</span><span class="muted">${esc((scope.length ? scope : ch.classes).join(', '))}${teacher ? `. ${fmtDay(ch.starts_on)} to ${fmtDay(ch.ends_on)}` : ''}</span></div>
    ${by.length > 1 ? `<div class="byclass" aria-label="Each class's part">${by.map(b=>`<span class="${b.id===mine?'mine':''}">${esc(b.name)}${b.id===mine?' (your class)':''} <b>${num(b.progress)}</b></span>`).join('')}</div>` : ''}
    ${teacher ? `<p style="margin:10px 0 0"><button class="btn ghost small" data-delch="${ch.id}">Delete</button></p>` : ''}</div>`;

/* ===== Fitness check results ===== */
const fmtTest = (r, k) => r?.[k]==null ? '–' : k==='pushup' ? `${r.pushup}${r.pushup_type==='knee'?' (knee)':''}` : `${r[k]}${TESTS.find(t=>t.k===k).unit==='sec'?'s':''}`;
function chg(a, b, k){
  if(a?.[k]==null || b?.[k]==null || (k==='pushup' && a.pushup_type!==b.pushup_type)) return '';
  const d = b[k]-a[k];
  return `<span class="${d>0?'':'muted'}">${d>0?'+':''}${d}</span>`;
}
function testTableHTML(tests){
  const first = tests[0].results, last = tests[tests.length-1].results;
  return `<div class="tbl-wrap panel"><table>
    <thead><tr><th>Check</th><th>Date</th>${TESTS.map(t=>`<th>${t.short}</th>`).join('')}</tr></thead>
    <tbody>${tests.map(t=>`<tr><td>${esc(t.label)}</td><td>${fmtDate(t.created_at)}</td>${TESTS.map(x=>`<td>${fmtTest(t.results,x.k)}</td>`).join('')}</tr>`).join('')}
    ${tests.length>1 ? `<tr><th colspan="2">Change since first</th>${TESTS.map(x=>`<td>${chg(first,last,x.k)}</td>`).join('')}</tr>` : ''}</tbody></table></div>`;
}
function classTestTable(st, tests){
  const rows = st.map(s=>{
    const mine = tests.filter(t=>t.student_id===s.id); if(!mine.length) return '';
    const a = mine[0].results, b = mine[mine.length-1].results;
    return `<tr><td>${esc(s.name)}</td><td>${mine.length}</td>${TESTS.map(t=>`<td>${mine.length>1 ? `${fmtTest(a,t.k)} → ${fmtTest(b,t.k)} ${chg(a,b,t.k)}` : fmtTest(b,t.k)}</td>`).join('')}</tr>`;
  }).join('');
  return `<table><thead><tr><th>Student</th><th>Checks</th>${TESTS.map(t=>`<th>${t.short}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <p class="muted small">With two or more checks: first → latest (change). Push-up changes only count when the same version was used.</p>`;
}

/* ===== Fitness check runner ===== */
let FT = null;
function showFitnessCheck(){
  try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume && audio.resume(); }catch(e){}
  keepAwake();
  FT = {i:0, r:{pushup_type:'full'}, timer:null};
  fitIntro();
}
function fitStop(){ if(FT?.timer){ clearInterval(FT.timer); FT.timer = null; } }
function fitEnd(){ fitStop(); FT = null; try{ wake?.release(); }catch(e){} wake = null; }
const fitHead = () => `<p class="muted" style="margin-bottom:0">Fitness check: ${esc(S.extras.test_label)}. Test ${FT.i+1} of ${TESTS.length}</p>`;
function fitIntro(){
  fitStop(); const t = TESTS[FT.i];
  setView(`${fitHead()}<h1>${esc(t.name)}</h1><p>${esc(t.text)}</p>
    ${t.k==='pushup' ? `<p><span class="seg" role="group" aria-label="Push-up version">${['full','knee'].map(v=>`<button type="button" data-pt="${v}" aria-pressed="${FT.r.pushup_type===v}">${v==='full'?'Full push-ups':'Knee push-ups'}</button>`).join('')}</span></p>` : ''}
    <p class="muted">${t.unit==='reps' ? 'You have 1 minute. Count your reps out loud.' : `Hold as long as you can. The timer stops by itself at ${TEST_MAX_HOLD/60} minutes.`}</p>
    <div class="btns"><button class="btn" id="go">Start</button><button class="btn ghost" id="howT">How to</button></div>
    <p style="margin-top:28px"><button class="link small" id="skipT">Skip this test (injured or unable)</button></p>
    <p><button class="link small" id="quitT">Quit the fitness check</button></p>`);
  $$('[data-pt]').forEach(b=>b.onclick=()=>{ FT.r.pushup_type=b.dataset.pt; $$('[data-pt]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  $('#howT').onclick = () => showHow(t.how[0], t.k==='pushup' && FT.r.pushup_type==='knee' ? 2 : t.how[1]);
  $('#go').onclick = fitRun;
  $('#skipT').onclick = () => { FT.r[t.k] = null; fitNext(); };
  $('#quitT').onclick = () => { if(confirm('Quit the fitness check? Nothing will be saved.')){ fitEnd(); showStudentHome(); } };
}
function fitRun(){
  const t = TESTS[FT.i], reps = t.unit==='reps', t0 = Date.now()+3000;
  setView(`${fitHead()}<h1>${esc(t.name)}</h1><div class="big-time" id="tt" aria-live="off">3</div>
    <p class="center" id="tmsg">Get ready</p><p class="center"><button class="btn" id="stop">Cancel</button></p>`);
  let shown = null, started = false;
  const finish = sec => { fitStop(); beep(1046,.35); fitResult(reps ? '' : sec); };
  $('#stop').onclick = () => { if(!started) return fitIntro(); finish(Math.min(TEST_MAX_HOLD, Math.floor((Date.now()-t0)/1000))); };
  FT.timer = setInterval(() => {
    const el = $('#tt'); if(!el) return fitStop();
    const now = Date.now();
    if(now < t0){ const s = Math.ceil((t0-now)/1000); if(s!==shown){ shown=s; el.textContent=s; beep(660,.1); } return; }
    if(!started){ started = true; beep(1046,.25); $('#tmsg').textContent = reps ? 'Go! Count your reps' : 'Hold!'; $('#stop').textContent = reps ? 'Stop early' : 'Stop'; }
    const sec = Math.floor((now-t0)/1000);
    if(reps){ const left = Math.max(0, TEST_REPS_SEC-sec); if(left!==shown){ shown=left; el.textContent=left; if(left>0 && left<=3) beep(660,.1); } if(left<=0) finish(); }
    else { if(sec!==shown){ shown=sec; el.textContent=sec; } if(sec>=TEST_MAX_HOLD) finish(TEST_MAX_HOLD); }
  }, 150);
}
function fitResult(v){
  const t = TESTS[FT.i];
  setView(`${fitHead()}<h1>${esc(t.name)}</h1>
    <label class="field"><span>${t.unit==='reps' ? 'How many did you do?' : 'Seconds held'}</span><input id="res" class="score" type="number" min="0" inputmode="numeric" value="${v}"></label>
    <div class="btns"><button class="btn" id="next">${FT.i<TESTS.length-1 ? 'Next test' : 'See my results'}</button><button class="btn ghost" id="redo">Redo this test</button></div>`);
  const inp = $('#res'); inp.focus();
  const go = () => { if(inp.value==='') return toast('Type your score.'); FT.r[t.k] = Math.max(0, parseInt(inp.value,10)||0); fitNext(); };
  $('#next').onclick = go; inp.onkeydown = e => { if(e.key==='Enter') go(); };
  $('#redo').onclick = fitIntro;
}
function fitNext(){ if(FT.i < TESTS.length-1){ FT.i++; fitIntro(); } else fitSummary(); }
function fitSummary(){
  const prev = S.extras.tests[S.extras.tests.length-1]?.results;
  setView(`<h1>Fitness check done</h1><p class="muted">${esc(S.extras.test_label)}. Check your results, then save.</p>
    <div class="tbl-wrap panel"><table><thead><tr><th>Test</th><th>Today</th>${prev ? '<th>Last check</th><th>Change</th>' : ''}</tr></thead>
    <tbody>${TESTS.map(t=>`<tr><td>${esc(t.name)}</td><td><b>${fmtTest(FT.r,t.k)}</b></td>${prev ? `<td>${fmtTest(prev,t.k)}</td><td>${chg(prev,FT.r,t.k)}</td>` : ''}</tr>`).join('')}</tbody></table></div>
    <p style="margin-top:20px"><button class="btn" id="saveT">Save results</button> <button class="btn ghost" id="discT">Discard</button></p>`);
  $('#discT').onclick = () => { if(confirm('Discard these results?')){ fitEnd(); showStudentHome(); } };
  $('#saveT').onclick = async () => {
    $('#saveT').disabled = true;
    try{ await Store.addTest(S.token, FT.r); fitEnd(); toast('Fitness check saved'); showStudentHome(); }
    catch(e){ $('#saveT').disabled = false; fail(isNetErr(e) ? 'No connection. Reconnect and press Save again' : 'Could not save', e); }
  };
}

/* ===== Import students from a spreadsheet (Excel, LibreOffice, CSV, Google Sheets as .xlsx) =====
   The file is read in the browser. Only student names and class names are sent to the database. */
const normH = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]+/g,' ').trim();
const HEAD_RX = {  // column headings we recognise, in English and French (accents removed)
  first: /^(first ?names?|given ?names?|forenames?|prenoms?|first)$/,
  last: /^(last ?names?|surnames?|family ?names?|noms? de famille|noms?|last)$/,
  full: /^(full ?names?|names?|students?|student ?names?|pupils?|pupil ?names?|learners?|learner ?names?|eleves?|nom complet|noms? (et )?prenoms?|prenoms? (et )?noms?)$/,
  year: /^(year|years|year ?group|year ?level|yr|yr ?group|grade|grade ?level|niveau)$/,
  cls: /^(class|classes|class ?name|form|forms|form ?group|form ?class|tutor ?group|tutor|reg ?group|registration ?group|groups?|groupes?|classes?|sections?|homeroom|division)$/
};
// Recognise a form column from its values when the heading is unusual: 10C, 10 C, 10-C, Y10C, 10/2
const FORM_RX = /^(?:y(?:ea)?r?\s*)?\d{1,2}\s*(?:[-.]?\s*[a-z]{1,3}|\/\s*\d{1,2})$/i;
const YEARISH_RX = /^(?:y(?:ea)?r?\s*)?\d{1,2}$/i;   // 10, Y10, Year 10

const genCode = () => { const A = 'abcdefghjkmnpqrstuvwxyz23456789', r = crypto.getRandomValues(new Uint32Array(6)); return Array.from(r, x=>A[x % A.length]).join(''); };

const sheetRows = sn => XLSX.utils.sheet_to_json(IM.wb.Sheets[sn], {header:1, defval:'', blankrows:false, raw:false});

    const kinds = rows[i].map(c=>{ const h=normH(c); return h ? Object.keys(HEAD_RX).find(k=>HEAD_RX[k].test(h)) || null : null; });

async function readSheetFile(file){
  const buf = await file.arrayBuffer();
  if(/\.(csv|tsv|txt)$/i.test(file.name)){

    let text;
    try{ text = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
    catch(e){ text = new TextDecoder('windows-1252').decode(buf); }
    return XLSX.read(text.replace(/^﻿/, ''), {type:'string', raw:true});
  }
  return XLSX.read(buf, {type:'array'});
}

function imDetect(initial){
  const base = !initial && IM.sheets.includes(IM.sheet) ? IM.sheet : IM.sheets[0];
  const rows = sheetRows(base), h = detectHeader(rows), at = k => h.kinds.indexOf(k);
  const fi = at('first'), la = at('last'), fu = at('full'), cl0 = at('cls');
  let yr = at('year'), cl = cl0;
  const width = Math.max(1, ...rows.slice(0, 50).map(r=>r.length)), start = h.row + 1;
  // Prefer a column whose values look like forms (10C) over a class column that only holds year groups
  const formCol = Array.from({length:width}, (_,i)=>i).find(i=>![fi, la, fu].includes(i) && colShare(rows, start, i, FORM_RX) >= 0.8);
  if(formCol !== undefined && (cl < 0 || (colShare(rows, start, cl, FORM_RX) < 0.8 && colShare(rows, start, cl, YEARISH_RX) >= 0.8))) cl = formCol;
  if(yr < 0 && cl0 >= 0 && cl0 !== cl && colShare(rows, start, cl0, YEARISH_RX) >= 0.8) yr = cl0;   // that column gives the year group instead
  if(initial) IM.sheet = IM.sheets.length>1 && cl<0 ? '*' : base;   // several sheets and no class column: one sheet per class
  IM.hasHeader = h.row >= 0;
  const head = h.row>=0 ? rows[h.row] : [], sample = rows[h.row+1] || [];
  IM.cols = Array.from({length:width}, (_,i)=>{ const t=String(head[i]??'').trim(), s=String(sample[i]??'').trim(); return `Column ${XLSX.utils.encode_col(i)}${t ? ` (${t})` : s ? ` (e.g. ${s})` : ''}`; });
  IM.onlyPreset = !!IM.preset && cl>=0;   // from a class page with a class column: tick only that class
  IM.map = {
    mode: fi>=0 && la>=0 ? 'firstlast' : 'full',
    full: fu>=0 ? fu : la>=0 ? la : fi>=0 ? fi : 0,
    first: Math.max(fi, 0), last: Math.max(la, 0), order:'fl',
    cls: cl>=0 ? 'col:'+cl : IM.preset ? 'into:'+IM.preset : IM.sheet==='*' ? 'sheet' : 'new',

}

function imRows(){
  const out = [], m = IM.map;
  for(const sn of IM.sheet==='*' ? IM.sheets : [IM.sheet]){
    const rows = sheetRows(sn), h = IM.hasHeader ? Math.max(0, detectHeader(rows).row) : -1;
    for(const r of rows.slice(h+1)){
      if(!r.some(c=>String(c ?? '').trim())) continue;   // empty row
      const cell = i => String(r[i] ?? '').replace(/\s+/g, ' ').trim();
      const name = m.mode==='firstlast'

      out.push({name, cls: m.cls.startsWith('col:') ? cell(+m.cls.slice(4)) : m.cls==='sheet' ? sn.trim() : '',

    <datalist id="yearListIm">${yearOptions(IM.classes)}</datalist>`;
  box.querySelectorAll('[data-yr]').forEach(x=>x.oninput=()=>{ IM.years[x.dataset.yr] = x.value; });
  box.querySelectorAll('[data-inc]').forEach(x=>x.onchange=()=>{ IM.include[x.dataset.inc] = x.checked; imPreview(); });
  box.querySelectorAll('[data-dest]').forEach(x=>x.onchange=()=>{ IM.dest[x.dataset.dest] = x.value; imPreview(); });
  box.querySelectorAll('[data-code]').forEach(x=>x.oninput=()=>{ IM.codes[x.dataset.code] = x.value; });
  if($('#imMove')) $('#imMove').onchange = e => { IM.move = e.target.checked; };
  if($('#imFresh')) $('#imFresh').onchange = e => { IM.fresh = e.target.checked; imPreview(); };
  $('#imGo').onclick = imImport;
}
async function imImport(){
  const todo = imGroups().groups.filter(imIncluded);
  for(const g of todo){
    if(imDest(g)!=='new') continue;
    if(!g.label) return toast('Type a name for the new class.');
    if(String(IM.codes[g.key]||'').trim().length < 3) return toast(`The class code for ${g.label} needs at least 3 characters.`);
  }
  if(IM.fresh && IM.classes.length){
    const a = prompt(`This deletes ${IM.stats.classes} classes, ${IM.stats.students} students and ${IM.stats.workouts} workouts before importing. Type DELETE to confirm.`);
    if(a===null || a.trim().toUpperCase()!=='DELETE') return toast('Nothing was deleted or imported.');
  }
  const btn = $('#imGo'); btn.disabled = true; btn.textContent = 'Importing…';
  let added = 0, moved = 0, total = 0, made = 0;
  try{
    if(IM.fresh){
      for(const c of IM.classes) await Store.tDeleteClass(S.teacher, c.id);
      IM.classes = []; IM.everyone = []; IM.byName = new Map(); IM.back = null; IM.stats = {classes:0, students:0, workouts:0};
    }
  }catch(e){ btn.disabled = false; btn.textContent = 'Try again'; return fail('Could not delete the old classes', e); }
  const left = new Set(IM.everyone.map(s=>s.class_id));   // classes that had students before
  try{
    for(const g of todo){
      let id = imDest(g);
      if(id==='new'){
        const year = normYear(imYear(g));
        id = await Store.tAddClass(S.teacher, g.label, IM.codes[g.key].trim(), IM.goal, year);
        IM.classes.push({id, name:g.label, year_group:year||null}); IM.dest[g.key] = id; made++;   // a retry adds to this class instead of making another
      }
      let names = g.names;
      if(IM.move){
        const mv = imMovers(g, id);
        if(mv.length){
          moved += await Store.tMoveStudents(S.teacher, id, mv.map(m=>m.id));
          mv.forEach(m=>{ IM.byName.get(norm(m.name))[0].class_id = id; });   // so a retry sees them in their new class
          const gone = new Set(mv.map(m=>norm(m.name)));
          names = names.filter(n=>!gone.has(norm(n)));
        }
      }
      added += await Store.tAddStudents(S.teacher, id, names); total += g.names.length;
    }
  }catch(e){
    btn.disabled = false; btn.textContent = 'Try again';
    return fail(`Import stopped after ${added + moved} student${added + moved===1?'':'s'}`, e);
  }
  const emptied = [...left].filter(id=>!IM.everyone.some(s=>s.class_id===id)).map(className);
  toast(`${added} student${added===1?'':'s'} added${moved ? `, ${moved} moved from another class` : ''}${made ? ` in ${made} new class${made===1?'':'es'}` : ''}`
    + `${total>added+moved ? `. ${total-added-moved} were already there` : ''}.`
    + `${emptied.length ? ` ${emptied.join(', ')} ${emptied.length===1?'is':'are'} now empty: you can delete ${emptied.length===1?'it':'them'}.` : ''}`);
  IM.back ? showClass(IM.back) : showTeacherHome();
}

/* ===== Excel export ===== */
const H_WORK = ['Date','Time','Student','Exercises','Rounds','Work (s)','Rest (s)','Average level','Total reps','Total hold (s)','Duration (min)','Effort (1-10)','Workout of the week'];
const H_EX = ['Date','Time','Student','Movement','Exercise','Level','Unit','Round 1','Round 2','Round 3','Best','Total'];
const H_ST = ['Student','Workouts','This week','Weekly goal','Streak (weeks)','Last workout','Total reps','First average level','Latest average level','Ready to level up'];
const H_PR = ['Student','Movement','Current level','Best round','Unit','Times at this level','Next step'];
const H_FIT = ['Date','Student','Check','Squats (1 min)','Push-ups (1 min)','Push-up version','Plank (s)','Wall sit (s)','Jumping jacks (1 min)'];
const STATUS_TXT = {ready:'Ready for next level', working:'Keep going', top:'Top level', mastered:'Top level mastered'};
const rowsWork = ss => ss.map(s=>({'Date':fmtDate(s.created_at),'Time':fmtTime(s.created_at),'Student':s.student_name,'Exercises':s.exercises.length,'Rounds':s.rounds,'Work (s)':s.work_sec,'Rest (s)':s.rest_sec,'Average level':avgLvl(s),'Total reps':s.total_reps,'Total hold (s)':s.total_hold_sec,'Duration (min)':+(s.duration_sec/60).toFixed(1),'Effort (1-10)':s.rpe,'Workout of the week':s.plan_id?'Yes':''}));
const rowsEx = ss => ss.flatMap(s=>s.exercises.map(e=>({'Date':fmtDate(s.created_at),'Time':fmtTime(s.created_at),'Student':s.student_name,'Movement':e.family,'Exercise':e.name,'Level':e.level,'Unit':e.unit==='sec'?'seconds':'reps','Round 1':e.results[0]??'','Round 2':e.results[1]??'','Round 3':e.results[2]??'','Best':Math.max(...e.results),'Total':sum(e.results)})));
const rowsSt = (st,ss,goal) => st.map(x=>{ const m=ss.filter(s=>s.student_id===x.id), w=weekStats(m,goal);
  return {'Student':x.name,'Workouts':m.length,'This week':w.thisWeek,'Weekly goal':goal,'Streak (weeks)':w.streak,'Last workout':m[0]?fmtDate(m[0].created_at):'','Total reps':sum(m.map(s=>s.total_reps)),
    'First average level':m.length?avgLvl(m[m.length-1]):'','Latest average level':m.length?avgLvl(m[0]):'','Ready to level up':m.length?readyCount(analyse(m)):''}; });
const rowsPr = (st,ss) => st.flatMap(x=>{ const A=analyse(ss.filter(s=>s.student_id===x.id));
  return FAMILIES.map(f=>A.fams[f.id]).filter(Boolean).map(f=>({'Student':x.name,'Movement':FAM[f.fid].name,'Current level':f.level,'Best round':f.best,'Unit':f.unit==='sec'?'seconds':'reps','Times at this level':f.times,'Next step':STATUS_TXT[f.status]})); });
const rowsFit = tests => tests.map(t=>{ const r=t.results; return {'Date':fmtDate(t.created_at),'Student':t.student_name,'Check':t.label,'Squats (1 min)':r.squat??'','Push-ups (1 min)':r.pushup??'','Push-up version':r.pushup==null?'':r.pushup_type,'Plank (s)':r.plank??'','Wall sit (s)':r.wallsit??'','Jumping jacks (1 min)':r.jacks??''}; });
function sheet(rows, headers){
  const ws = rows.length ? XLSX.utils.json_to_sheet(rows,{header:headers}) : XLSX.utils.aoa_to_sheet([headers]);
  ws['!cols'] = headers.map(h=>({wch: Math.min(40, Math.max(h.length, ...rows.map(r=>String(r[h]??'').length)) + 2)}));
  return ws;
}
const fileSafe = s => s.replace(/[\\/:*?"<>|]/g,'').trim() || 'class';
function sheetName(name, used){
  let base = name.replace(/[\[\]*?\/\\:]/g,'').slice(0,28) || 'Class', n = base, k = 2;
  while(used.has(n.toLowerCase())) n = `${base} ${k++}`;
  used.add(n.toLowerCase()); return n;
}
async function downloadClass(c){
  if(!window.XLSX) return toast('The Excel library did not load. Check your internet connection and reload.');
  try{
    const [st,ss,X] = await Promise.all([Store.tStudents(S.teacher, c.id), Store.tSessions(S.teacher, c.id), Store.tClassExtras(S.teacher, c.id)]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, sheet(rowsSt(st,ss,c.weekly_goal||3),H_ST), 'Students');
    XLSX.utils.book_append_sheet(wb, sheet(rowsPr(st,ss),H_PR), 'Progress');
    XLSX.utils.book_append_sheet(wb, sheet(rowsFit(X.tests),H_FIT), 'Fitness checks');
    XLSX.utils.book_append_sheet(wb, sheet(rowsWork(ss),H_WORK), 'Workouts');
    XLSX.utils.book_append_sheet(wb, sheet(rowsEx(ss),H_EX), 'Exercise log');
    XLSX.writeFile(wb, `${fileSafe(c.name)} bodyweight results.xlsx`);
  }catch(e){ fail('Could not download', e); }
}
async function downloadAll(){
  if(!window.XLSX) return toast('The Excel library did not load. Check your internet connection and reload.');
  try{
    const classes = await Store.tClasses(S.teacher);
    if(!classes.length) return toast('No classes to download yet.');
    const wb = XLSX.utils.book_new(), used = new Set();
    for(const c of classes){ const ss = await Store.tSessions(S.teacher, c.id); XLSX.utils.book_append_sheet(wb, sheet(rowsWork(ss),H_WORK), sheetName(c.name,used)); }
    XLSX.writeFile(wb, 'All classes bodyweight results.xlsx');
  }catch(e){ fail('Could not download', e); }
}

/* ===== Start ===== */
(async function boot(){
  netBanner();
  loadDemos();
  const t = tabStore.get('bwb-teacher');
  if(t){ S.teacher = t; return showTeacherHome(); }
  const a = auth.get();
  if(a?.token){
    S.token=a.token; S.student=a.student; S.cls=a.cls;
    showStudentHome();
    try{ const me = await Store.me(a.token); S.student=me.student; S.cls=me.cls; auth.update({...a, ...me}); header(); }
    catch(e){ if(isExpired(e)) logout(e.message); }
    return;
  }
  showHome();
})();
